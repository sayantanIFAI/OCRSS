# Backlog E1-S1: lint + unit tests on every push and pull request; a red run blocks the merge once
# branch protection requires the "ci / unit-gate" check (see docs/ci.md). Same gate as
# `python scripts/ci.py` locally. No GPU and no infra: the stub VLM backend (TECH_STACK §8).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,ocr,load]"
      - name: Lint, format, types, unit tests
        run: python scripts/ci.py

  grammar-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CDI_TEST_REQUIRE_GRAMMAR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned CPU grammar engine
        run: |
          python -m pip install 'torch==2.8.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]" 'xgrammar==0.1.25' 'transformers==4.57.6'
      - name: Cache the pinned public Qwen tokenizer
        run: |
          python - <<'PY'
          from transformers import AutoTokenizer
          from tests.test_grammar_unit import TOKENIZER, TOKENIZER_REVISION
          AutoTokenizer.from_pretrained(TOKENIZER, revision=TOKENIZER_REVISION)
          PY
      - name: Prove token rejection and schema-valid completion
        run: python -m pytest tests/test_grammar_unit.py -q

  # E1-S2: the same Postgres + source-built MinIO service containers as the fallback.
  integration-gate:
    needs: [unit-gate, grammar-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CDI_PG_BIN: /usr/lib/postgresql/16/bin
      CDI_COMPOSE_SECRETS_DIR: ${{ github.workspace }}/../cdi-ci-secrets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,ocr,load]"
      - name: PostgreSQL tools for restore and failover drills
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-16 postgresql-client-16 postgresql-contrib
          sudo systemctl stop postgresql
      - name: Isolated service containers
        run: |
          python scripts/compose_secrets.py "$CDI_COMPOSE_SECRETS_DIR"
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/ci.yml up -d --build --wait postgres minio redis
      - name: Integration tests + pipeline audit + golden path
        run: bash scripts/ci_integration.sh
      # E6-S1/E6-S4: the real HL7 validator on the golden bundles, from the pinned package set,
      # offline; fails on any IG error beyond tests/golden/fhir/validation-baseline.json
      - name: ABDM IG validation of the golden bundles
        run: |
          set -a; . infra/runpod/versions.env; set +a
          sudo apt-get install -y -qq openjdk-21-jre-headless
          export CDI_FHIR_PACKAGE_HOME="$RUNNER_TEMP/fhir-home" CDI_FHIR_VALIDATOR_JAR="$RUNNER_TEMP/validator_cli.jar"
          curl -fsSL -o "$CDI_FHIR_VALIDATOR_JAR" \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/$FHIR_VALIDATOR_VERSION/validator_cli.jar"
          echo "$FHIR_VALIDATOR_SHA256  $CDI_FHIR_VALIDATOR_JAR" | sha256sum -c -
          python scripts/fhir_ig.py seed --home "$CDI_FHIR_PACKAGE_HOME"
          python scripts/fhir_golden.py --validate
      - name: Container diagnostics
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/ci.yml logs --tail=100
      - name: Stop disposable services
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml -f infra/compose/ci.yml down -v
