# Alternative deployment (TECH_STACK §13 "Alt-deploy"): backing services + the ingest path on a
# non-RunPod host. NOT used on the pod (the pod runs native processes, ARCHITECTURE §3.3).
# As built there is no webapp / mlserve service here — adding them is backlog E1-S3.
name: cdi-adapter

x-app: &app
  build:
    context: ../..
    dockerfile: infra/compose/Dockerfile
  env_file: ../../.env
  environment:
    CDI_DATABASE_URL: postgresql+psycopg://cdi:cdi@postgres:5432/cdi
    CDI_REDIS_URL: redis://redis:6379/0
    CDI_S3_ENDPOINT_URL: http://minio:9000
    CDI_INBOX_DIR: /data/inbox
    CDI_PROCESSED_DIR: /data/processed
    CDI_FAILED_DIR: /data/failed
  volumes:
    - inbox:/data
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: cdi, POSTGRES_PASSWORD: cdi, POSTGRES_DB: cdi}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U cdi"], interval: 5s, retries: 20}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}

  minio:
    # the release recorded in ARCHITECTURE App. B; MinIO's images live on quay.io (the Docker Hub
    # repository returns 404) — tag verified to exist on 2026-09-21
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck: {test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"], interval: 5s, retries: 20}

  createbuckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z  # verified on quay.io 2026-09-21
    depends_on: {minio: {condition: service_healthy}}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/cdi-documents"]

  migrate:
    <<: *app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "cdi_adapter.api:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["127.0.0.1:8080:8080"]

  worker:
    <<: *app
    command: ["celery", "-A", "cdi_adapter.worker.celery_app", "worker", "-Q", "cdi", "--concurrency", "2"]

  watcher:
    <<: *app
    command: ["cdi-ingest-watch"]

  # vllm: optional serving backend — backlog E2-S1 (dormant in the as-built system)

volumes:
  pgdata:
  redisdata:
  miniodata:
  inbox:
