[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdi-adapter"
version = "0.1.0"
description = "Clinical Document Intelligence Adapter: scanned legacy records -> governed EMR + ABDM FHIR R4 bundles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # web / API
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # database
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    # object storage
    "boto3>=1.34",
    # background processing
    "celery[redis]>=5.3",
    "watchdog>=4.0",
    # document imaging
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pillow>=10.2",
    # structured-output safety
    "jsonschema>=4.21",
    "referencing>=0.34",
    # model-gateway client
    "httpx>=0.27",
    # logging
    "structlog>=24.1",
    # declared only (TECH_STACK §15): not imported anywhere
    "tenacity>=8.2",
]

[project.scripts]
cdi-ingest-watch = "cdi_adapter.ingest.watcher:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9", "pyyaml>=6.0"]
ocr = ["rapidocr-onnxruntime>=1.3", "onnxruntime>=1.17"]
# torch (+CUDA) is preinstalled on the pod image and inherited via --system-site-packages
ml = ["transformers>=4.49", "accelerate>=0.30", "qwen-vl-utils>=0.0.8", "einops>=0.7", "sentencepiece>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with these calls in defaults
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# server-rendered HTML/CSS/JS templates (ARCHITECTURE §7): long literal lines are markup, not code
"src/cdi_adapter/webapp/*_page.py" = ["E501"]
"src/cdi_adapter/webapp/page.py" = ["E501"]
"src/cdi_adapter/webapp/theme.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: needs Postgres + MinIO (+ stub VLM); run with -m integration",
]

[tool.mypy]
# the pod runs 3.12 (ARCHITECTURE App. B); NumPy's stubs use 3.12-only syntax
python_version = "3.12"
ignore_missing_imports = true
